  /* --- geometric entrance, from a visible resting state --- */

  @keyframes ci-in   { from { transform: translateX(26px) scale(0.86); } to { transform: none; } }

  /* --- Bauhaus hover inversion ---------------------------------
     Elements carry --acc / --acc-on (and --base / --base-on where
     they start filled). The swap is a flat colour exchange: no
     shadow, no gradient, no easing beyond a crisp 120ms.        */

  .bh-chip {
    background: transparent;
    color: var(--ink);
    border-color: var(--line);
    transition: background-color 120ms linear, color 120ms linear, border-color 120ms linear;
  }
  .bh-chip:hover,
  .bh-chip:focus-visible {
    background: var(--acc);
    color: var(--acc-on);
    border-color: var(--acc);
  }

  .bh-btn {
    background: var(--base);
    color: var(--base-on);
    border-color: var(--line);
    transition: background-color 120ms linear, color 120ms linear, border-color 120ms linear;
  }
  .bh-btn:hover,
  .bh-btn:focus-visible {
    background: var(--acc);
    color: var(--acc-on);
    border-color: var(--acc);
  }
  .bh-btn .bh-dot { transition: background-color 120ms linear; }
  .bh-btn:hover .bh-dot { background: var(--acc-on) !important; }

  .bh-card { transition: transform 140ms ease; }
  .bh-card:hover { transform: translateY(-4px); }
  .bh-num {
    background: var(--acc);
    color: var(--acc-on);
    transition: background-color 140ms linear, color 140ms linear;
  }
  .bh-card:hover .bh-num { background: var(--ground); color: var(--acc); }
  .bh-shape { background: var(--acc-on); transition: background-color 140ms linear; }
  .bh-card:hover .bh-shape { background: var(--acc); }
  .bh-rule { transition: width 140ms ease; }
  .bh-card:hover .bh-rule { width: 100%; }

  /* --- Hero: word ⇄ figure linkage ------------------------------
     Each trait word owns one figure. Hovering a word promotes its
     figure (scale, rotation, hard offset shadow) and drops the other
     two back, so attention lands on exactly one shape at a time.  */

  .hero-word {
    display: block;
    width: max-content;
    max-width: 100%;
    line-height: 0.95;
    padding: 0.04em 0.1em;
    margin-left: -0.1em;
    border: 4px solid transparent;
    background: transparent;
    color: var(--ink);
    cursor: default;
    transition: background-color 140ms linear, color 140ms linear, border-color 140ms linear;
  }
  /* driven by state, so a figure hover lights the word and vice versa */
  .hero-word.is-on,
  .hero-word:focus-visible {
    background: var(--acc);
    color: var(--acc-on);
    border-color: var(--line);
    outline: none;
  }
  /* the two words not being pointed at step back */
  .hero-word.is-off { color: var(--ink-soft); }

  /* The composition keeps the old 320 × 344 drawing grid, so every
     figure is positioned as a percentage of that box and the three
     shapes stay in the same places they were drawn in.            */
  .hero-comp { position: relative; width: 100%; aspect-ratio: 320 / 344; }

  .figbox { position: absolute; }
  .figbox-sqr { left: 3.75%;  top: 4.07%;  width: 43.75%; height: 40.70%; }
  .figbox-cir { left: 53.75%; top: 3.49%;  width: 45.00%; height: 41.86%; }
  .figbox-tri { left: 6.25%;  top: 55.23%; width: 87.50%; height: 40.12%; }

  .fighit {
    position: absolute;
    inset: 0;
    cursor: pointer;
    perspective: 1000px;
    transition: transform 240ms cubic-bezier(.16,1,.3,1), opacity 180ms linear;
  }

  /* the card that turns over */
  .flip {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 560ms cubic-bezier(.22,1,.36,1);
  }
  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .face-back { transform: rotateY(180deg); }

  /* geometry lives on an inner box so the faces keep their backface rule */
  .shape { position: absolute; inset: 0; overflow: hidden; }
  .shape img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .figbox-sqr .shape { border: 4px solid var(--line); }
  .figbox-cir .shape { border: 4px solid var(--line); border-radius: 50%; }
  /* inverted: wide edge on top, apex pointing down */
  .figbox-tri .shape { clip-path: polygon(0 0, 100% 0, 50% 100%); }

  .figbox-sqr .face-front .shape { background: var(--yellow); }
  .figbox-cir .face-front .shape { background: var(--blue); }
  .figbox-tri .face-front .shape { background: var(--red); }

  /* the triangle can't take a CSS border, so its edge is drawn */
  .tri-edge {
    position: absolute;
    inset: 0;
    overflow: visible;
    pointer-events: none;
  }

  /* dim every figure while one is held … */
  .hero-comp[data-active] .fighit { opacity: 0.22; }

  /* … then turn the matching one over and bring it forward */
  .hero-comp[data-active="sqr"] .figbox-sqr,
  .hero-comp[data-active="cir"] .figbox-cir,
  .hero-comp[data-active="tri"] .figbox-tri { z-index: 3; }

  .hero-comp[data-active="sqr"] .figbox-sqr .fighit,
  .hero-comp[data-active="cir"] .figbox-cir .fighit,
  .hero-comp[data-active="tri"] .figbox-tri .fighit { opacity: 1; transform: scale(1.06); }

  .hero-comp[data-active="sqr"] .figbox-sqr .flip,
  .hero-comp[data-active="cir"] .figbox-cir .flip,
  .hero-comp[data-active="tri"] .figbox-tri .flip { transform: rotateY(180deg); }

  @media (prefers-reduced-motion: reduce) {
    .bh-card:hover { transform: none; }
    .flip { transition: none; }
    .hero-comp[data-active] .fighit { transform: none !important; }
  }

  /* --- Plain chip: a black box and nothing else. No hover, no
         transition, no pointer change — it is a label, not a control. */
  .bw-chip {
    background: transparent;
    color: var(--ink);
    border: 2px solid var(--line);
    cursor: default;
  }

  /* --- Landing cover -------------------------------------------- */
  .landing {
    min-height: 100svh;
    background: var(--ground-alt);
    border-bottom: var(--rule-w) solid var(--line);
    display: flex;

  .landing-mark { width: min(46vw, 300px); height: auto; }
  @media (max-width: 640px) { .landing-mark { width: 62vw; } }

  @keyframes cover-in { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .cover-fade { animation: cover-in 760ms cubic-bezier(.16,1,.3,1) both; }
  .cover-d1 { animation-delay: 120ms; }
  .cover-d2 { animation-delay: 260ms; }
  .cover-d3 { animation-delay: 400ms; }

  @keyframes nudge { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
  .scroll-cue { animation: nudge 2.2s ease-in-out infinite; }

  /* nav stays out of the way until the cover is scrolled past */
  .topbar {
    transition: transform 320ms cubic-bezier(.16,1,.3,1), opacity 220ms linear;
  }
  .topbar[data-hidden="true"] {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
  }

  /* --- Fullscreen photo --------------------------------------- */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 70;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(16px, 4vw, 48px);
    opacity: 0;
    visibility: hidden;
    transition: opacity 240ms linear, visibility 0s linear 240ms;
  }
  .lightbox[data-open="true"] { opacity: 1; visibility: visible; transition-delay: 0s; }
  .lightbox-scrim { position: absolute; inset: 0; background: var(--ground); }
  .lightbox-scrim::after {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--acc);
    opacity: 0.14;
  }
  .lightbox-figure {
    position: relative;
    max-width: min(94vw, 1100px);
    max-height: 84svh;
    border: 4px solid var(--line);
    background: var(--ground);
    transform: scale(0.96);
    transition: transform 280ms cubic-bezier(.16,1,.3,1);
  }
  .lightbox[data-open="true"] .lightbox-figure { transform: none; }
  .lightbox-figure img {
    display: block;
    max-width: 100%;
    max-height: calc(84svh - 8px);
    width: auto;
    height: auto;
    object-fit: contain;
  }
  /* hover-opened: never swallow the pointer. click-opened: dismissable */
  .lightbox[data-modal="false"] { pointer-events: none; }

  /* --- Photography: capsule grid ------------------------------- */
  .cap {
    position: relative;
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
  }
  .cap-body {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: var(--ground-deep);
    border-radius: 0 999px 999px 0;
    transition: transform 180ms cubic-bezier(.16,1,.3,1);
  }
  .cap-body img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cap:hover .cap-body,
  .cap:focus-visible .cap-body { transform: translate(-3px, -3px); }
  .cap-note {
    position: absolute;
    right: 0;
    top: 0;
    width: 26%;
    aspect-ratio: 1;
    background: var(--yellow);
    transition: transform 180ms cubic-bezier(.16,1,.3,1);
  }
  .cap:hover .cap-note { transform: translate(3px, 3px); }
  .cap-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ground);
    opacity: 0.5;
  }

  /* --- Writing: isometric frames ------------------------------- */
  .iso { display: block; width: 100%; padding: 0; border: none; background: none; cursor: pointer; text-align: left; }
  .iso svg { display: block; width: 100%; height: auto; overflow: visible; }
  .iso g { transition: transform 200ms cubic-bezier(.16,1,.3,1); }
  .iso:hover g, .iso:focus-visible g { transform: translate(0, -7px); }
  .iso:focus-visible { outline: 3px solid var(--blue); outline-offset: 4px; }

  /* --- Reader: one essay, full page ---------------------------- */
  .reader {
    position: fixed;
    inset: 0;
    z-index: 80;
    background: var(--ground);
    overflow-y: auto;
    overscroll-behavior: contain;
    opacity: 0;
    visibility: hidden;
    transition: opacity 240ms linear, visibility 0s linear 240ms;
  }
  .reader[data-open="true"] { opacity: 1; visibility: visible; transition-delay: 0s; }

  .reader-bar {
    position: sticky;
    top: 0;
    z-index: 2;
    background: var(--ground);
    border-bottom: var(--border-w) solid var(--line);
  }

  /* Mandarin long-form: a shorter measure, a taller line, and no
     hyphenation games — about 34 characters to the line.          */
  .prose {
    font-family: 'Noto Sans TC', 'Jost', sans-serif;
    max-width: 34em;
    margin: 0 auto;
  }
  .prose p {
    margin: 0 0 1.45em;
    font-size: 16.5px;
    line-height: 2.05;
    letter-spacing: 0.02em;

  }
  .prose h3 {
    margin: 2.6em 0 1.1em;

    font-weight: 700;
    line-height: 1.5;

  }
  .prose h3::before {
    content: "";
    width: 0.62em;
    height: 0.62em;
    flex: none;
    background: var(--acc);
  }
  .prose h3:first-child { margin-top: 0; }
  @media (min-width: 640px) { .prose p { font-size: 17.5px; } }

  @media (prefers-reduced-motion: reduce) {
    .scroll-cue { animation: none; }
    .cover-fade { animation: none; }
    .iso:hover g, .cap:hover .cap-body, .cap:hover .cap-note { transform: none; }
  }

  .clamp-5 {
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .cjk { font-weight: 400; letter-spacing: 0.01em; line-height: 1.75; }

  /* Bauhaus half-circle / quarter-circle utility shapes */
  .half-top    { border-radius: 999px 999px 0 0; }
  .quarter-tl  { border-radius: 999px 0 0 0; }
  .quarter-br  { border-radius: 0 0 999px 0; }

function TopBar({ active, hidden }) {
  const [progress, setProgress] = useState(0);
  const [open, setOpen] = useState(false);

  useEffect(() => { if (hidden) setOpen(false); }, [hidden]);

  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      setProgress(max > 0 ? (h.scrollTop / max) * 100 : 0);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <header
      className="topbar sticky top-0 z-50"
      data-hidden={hidden ? "true" : undefined}

/* Full-screen photograph. Opened on hover from the hero (pointer
   transparent, dismisses itself) or by a click in the photography
   grid (modal, closes on click or Escape). */
function Lightbox({ data, onClose }) {
  const last = useRef(null);
  if (data) last.current = data;
  const d = data || last.current;
  const modal = Boolean(data && data.modal);

  useEffect(() => {
    if (!modal) return;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [modal, onClose]);

  return (
    <div
      className="lightbox"
      data-open={data ? "true" : undefined}
      data-modal={modal ? "true" : "false"}
      style={{ "--acc": (d && d.accent) || "var(--blue)" }}
      onClick={modal ? onClose : undefined}
      role={modal ? "dialog" : undefined}
      aria-modal={modal || undefined}
      aria-hidden={data ? undefined : "true"}
    >
      <div className="lightbox-scrim" />

      {d && (
        <figure className="lightbox-figure m-0">
          <img src={d.src} alt={d.caption || ""} />
          {d.caption && (
            <figcaption
              className="mono absolute bottom-0 left-0 px-3 py-2 text-[10px] uppercase tracking-[0.14em]"
              style={{ background: "var(--ground-deep)", color: "var(--ink-invert)" }}
            >
              {d.caption}
            </figcaption>
          )}
        </figure>
      )}

      {modal && (
        <button
          className="mono absolute right-4 top-4 border-2 px-3 py-2 text-[10px] font-semibold uppercase tracking-[0.16em] sm:right-8 sm:top-8"
          style={{ borderColor: "var(--line)", background: "var(--ground)", color: "var(--ink)" }}
          onClick={onClose}
        >
          Close ✕
        </button>
      )}
    </div>
  );
}

function HeroComposition({ active, bind }) {
  return (
    <div className="hero-comp" data-active={active || undefined}>
      {FIGURES.map((f) => (
        <div key={f.key} className={"figbox figbox-" + f.key + " " + f.entrance}>
          <div
            className="fighit"
            onPointerEnter={bind.enter(f.key)}
            onPointerLeave={bind.leave}
            onPointerDown={bind.tap(f.key)}
          >
            <div className="flip">
              <div className="face face-front">
                <div className="shape" />
                {f.key === "tri" && (
                  <svg className="tri-edge" viewBox="0 0 280 138" preserveAspectRatio="none" aria-hidden="true">
                    <polygon points="0,0 280,0 140,138" fill="none" stroke="var(--line)" strokeWidth="4" vectorEffect="non-scaling-stroke" />
                  </svg>
                )}
              </div>
              <div className="face face-back">
                <div className="shape">
                  <img src={f.photo} alt={f.alt} style={{ objectPosition: f.pos }} />
                </div>
                {f.key === "tri" && (
                  <svg className="tri-edge" viewBox="0 0 280 138" preserveAspectRatio="none" aria-hidden="true">
                    <polygon points="0,0 280,0 140,138" fill="none" stroke="var(--line)" strokeWidth="4" vectorEffect="non-scaling-stroke" />
                  </svg>
                )}
              </div>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* word → figure, and the primary each word answers to */
const TRAITS = [
  { word: "Initiator,",    fig: "tri", acc: "var(--red)",    on: "var(--on-red)" },
  { word: "Synthesizer,",  fig: "cir", acc: "var(--blue)",   on: "var(--on-blue)" },
  { word: "Observer",      fig: "sqr", acc: "var(--yellow)", on: "var(--on-yellow)" },
];

function Hero({ onPhoto, resetTick }) {
  const [note, setNote] = useState(false);
  const [active, setActive] = useState(null);

  /* A touch screen fakes a mouse: one tap fires pointerenter AND a
     click, so a plain hover+click pair opened and shut in the same
     tap and needed a second one. So the two inputs are kept apart —
     hover drives a mouse or pen, a tap drives touch, never both. */
  const viaTouch = useRef(false);

  const enter = (key) => (e) => {
    if (e.pointerType === "touch") return;
    viaTouch.current = false;
    setActive(key);
  };
  const leave = (e) => {
    if (e.pointerType === "touch") return;
    setActive(null);
  };
  const tap = (key) => (e) => {
    if (e.pointerType !== "touch") return;
    viaTouch.current = true;
    setActive((prev) => (prev === key ? null : key));
  };

  /* closing the full-screen photo also releases the shape */
  useEffect(() => { if (resetTick) setActive(null); }, [resetTick]);

  /* Hold a shape for a beat and the photograph takes the whole screen.
     A tap opens it at once and keeps it there to be dismissed, since a
     finger has no hover to end. */
  useEffect(() => {
    if (!active) { onPhoto(null); return; }
    const f = FIGURES.find((x) => x.key === active);
    if (!f) return;
    const modal = viaTouch.current;
    const t = setTimeout(
      () => onPhoto({ src: f.photo, caption: f.caption, accent: f.accent, modal }),
      modal ? 0 : 260
    );
    return () => clearTimeout(t);
  }, [active, onPhoto]);

  const onResume = (e) => {
    if (!RESUME_URL) {
      e.preventDefault();
      setNote(true);
    }
  };

              <span aria-hidden="true" className="mt-[3px] flex shrink-0">
                <span className="block h-2.5 w-2.5" style={{ background: "var(--red)" }} />
                <span className="block h-2.5 w-2.5 rounded-full" style={{ background: "var(--blue)" }} />
                <span className="block h-2.5 w-2.5" style={{ background: "var(--yellow)", clipPath: "polygon(50% 0, 100% 100%, 0 100%)" }} />
              </span>
              <span className="mono text-[10px] sm:text-[11px] font-medium uppercase tracking-[0.11em] leading-[1.75] sm:whitespace-nowrap"
                    style={{ color: "var(--ink-soft)" }}>
                Grew up in <strong className="font-semibold" style={{ color: "var(--ink)" }}>Taipei</strong>.
                Studied in <strong className="font-semibold" style={{ color: "var(--ink)" }}>Taichung</strong>,{" "}
                <strong className="font-semibold" style={{ color: "var(--ink)" }}>Kaohsiung</strong> and{" "}
                <strong className="font-semibold" style={{ color: "var(--ink)" }}>Belgium</strong>.
                <br />
                Based in <strong className="font-semibold" style={{ color: "var(--ink)" }}>Singapore</strong>.
              </span>
            </div>

            <h1 className="display rise rise-1 flex flex-col items-start gap-1 text-[44px] sm:text-[62px] lg:text-[72px]">
              {TRAITS.map((t) => (
                <span
                  key={t.fig}
                  className={
                    "hero-word" +
                    (active === t.fig ? " is-on" : active ? " is-off" : "")
                  }
                  tabIndex="0"
                  style={{ "--acc": t.acc, "--acc-on": t.on }}
                  onPointerEnter={enter(t.fig)}
                  onPointerLeave={leave}
                  onPointerDown={tap(t.fig)}
                  onFocus={() => setActive(t.fig)}
                  onBlur={() => setActive(null)}
                >
                  {t.word}
                </span>
              ))}
            </h1>

            <div aria-hidden="true" className="wipe my-7 h-[6px] w-full" style={{ background: "var(--line)" }} />

            <p className="rise rise-2 max-w-[56ch] text-[17px] sm:text-[19px] leading-[1.6]" style={{ color: "var(--ink)" }}>
              Asa&rsquo;s journey took her from a wandering childhood to Singapore, where she became a

              work, writing, and study with relentless drive. She writes of growth, everyday aviation,

            </p>

            <div className="mt-8 flex flex-wrap items-center gap-3">
              <a
                href={RESUME_URL || "#"}

                style={{

                }}
              >
                Download Resume

          <div className="col-span-12 lg:col-span-5 flex flex-col justify-between pb-12 lg:pb-16 lg:pt-16 lg:pl-10"
               style={{ borderLeft: "none" }}>
            <div className="max-w-[380px] lg:ml-auto w-full px-2">
              <HeroComposition active={active} bind={{ enter, leave, tap }} />
            </div>

            <div className="mt-8 lg:ml-auto w-full max-w-[380px]">
              <div className="eyebrow pb-3" style={{ color: "var(--ink-soft)" }}>Target roles</div>
              <ul className="flex flex-wrap gap-1.5 list-none p-0 m-0">
                {TARGETS.map((t) => (

        </div>

  );

/* One open frame, drawn in axonometric projection: top face red, the
   right cheek yellow, the face itself the page colour, and the whole
   thing standing on its own cast shadow. */
function IsoFrame({ w, h }) {
  const dx = 26, dy = 16, p = 16;
  const W = w, H = h;
  const front = `M0,0 L${W},0 L${W},${H} L${W - p},${H} L${W - p},${p} L${p},${p} L${p},${H} L0,${H} Z`;
  const top   = `M0,0 L${W},0 L${W + dx},${-dy} L${dx},${-dy} Z`;
  const side  = `M${W},0 L${W + dx},${-dy} L${W + dx},${H - dy} L${W},${H} Z`;
  const shade = `M0,${H} L${W},${H} L${W - dx},${H + dy} L${-dx},${H + dy} Z`;
  return (
    <svg viewBox={`${-dx - 6} ${-dy - 6} ${W + 2 * dx + 12} ${H + 2 * dy + 12}`} aria-hidden="true">
      <g stroke="var(--line)" strokeWidth="3" strokeLinejoin="round">
        <path d={shade} fill="var(--line)" />
        <path d={side}  fill="var(--yellow)" />
        <path d={top}   fill="var(--red)" />
        <path d={front} fill="var(--ground)" fillRule="evenodd" />
      </g>
    </svg>
  );
}

function WritingFrame({ piece, onOpen }) {
  return (
    <button className="iso" onClick={() => onOpen(piece.id)} aria-label={"Read: " + piece.title}>
      <IsoFrame w={piece.w} h={piece.h} />
      <div className="pt-4">
        <div className="eyebrow pb-1.5" style={{ color: "var(--ink-soft)" }}>
          {piece.kicker}{piece.year ? " · " + piece.year : ""}
        </div>
        <div className="text-[17px] font-bold leading-tight tracking-[-0.015em]">{piece.title}</div>
        {piece.subtitle && (
          <div className="pt-1 text-[12.5px] leading-snug" style={{ color: "var(--ink-soft)" }}>
            {piece.subtitle}
          </div>
        )}
        <div className="mono pt-2 text-[9.5px] uppercase tracking-[0.14em]" style={{ color: "var(--blue)" }}>
          Read →
        </div>
      </div>
    </button>
  );
}

/* One essay, opened over the page. Its own hash, so a single piece
   can be linked to and shared on its own. */
function Reader({ piece, onClose }) {
  const last = useRef(null);
  if (piece) last.current = piece;
  const d = piece || last.current;
  const ref = useRef(null);

  useEffect(() => {
    if (!piece) return;
    if (ref.current) ref.current.scrollTop = 0;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => {
      window.removeEventListener("keydown", onKey);
      document.body.style.overflow = prev;
    };
  }, [piece, onClose]);

  const accents = ["var(--blue)", "var(--red)", "var(--yellow)"];
  const acc = d ? accents[WRITING.findIndex((w) => w.id === d.id) % 3] : "var(--blue)";

  return (
    <div className="reader" ref={ref} data-open={piece ? "true" : undefined} aria-hidden={piece ? undefined : "true"}>
      <div className="reader-bar">
        <div className="mx-auto flex max-w-[1240px] items-center justify-between gap-4 px-5 py-3 sm:px-8">
          <button
            className="mono flex items-center gap-2 border-2 px-3 py-2 text-[10px] font-semibold uppercase tracking-[0.16em]"
            style={{ borderColor: "var(--line)", background: "var(--ground)", color: "var(--ink)" }}
            onClick={onClose}
          >
            ← All writing
          </button>
          <span className="mono truncate text-[10px] uppercase tracking-[0.16em]" style={{ color: "var(--ink-soft)" }}>
            {d ? d.kicker : ""}{d && d.year ? " · " + d.year : ""}
          </span>
        </div>
      </div>

      {d && (
        <article className="mx-auto max-w-[1240px] px-5 pb-24 pt-10 sm:px-8 sm:pt-14">
          <header className="prose pb-10">
            <div aria-hidden="true" className="mb-6 h-[10px] w-20" style={{ background: acc }} />
            <h1 className="text-[30px] font-bold leading-[1.3] tracking-[-0.01em] sm:text-[38px]"
                style={{ fontFamily: "'Noto Sans TC', 'Jost', sans-serif" }}>
              {d.title}
            </h1>
            {d.subtitle && (
              <p className="pt-3 text-[15px] leading-relaxed sm:text-[16.5px]" style={{ color: "var(--ink-soft)" }}>
                {d.subtitle}
              </p>
            )}
            <div className="mono pt-6 text-[10px] uppercase tracking-[0.18em]" style={{ color: "var(--ink-soft)" }}>
              {OWNER.latin}
            </div>
          </header>

          <div className="prose" style={{ "--acc": acc }}>
            {d.body.map((b, i) => (
              b.t === "h" ? <h3 key={i}>{b.x}</h3> : <p key={i}>{b.x}</p>
            ))}
          </div>

          <div className="prose pt-12">
            <div aria-hidden="true" className="h-[3px] w-full" style={{ background: "var(--line)" }} />
            <button
              className="mono mt-6 flex items-center gap-2 border-2 px-4 py-3 text-[10px] font-semibold uppercase tracking-[0.16em]"
              style={{ borderColor: "var(--line)", background: "var(--ground)", color: "var(--ink)" }}
              onClick={onClose}
            >
              ← All writing
            </button>
          </div>
        </article>
      )}
    </div>
  );
}

/* ============================================================
   APP
   ============================================================ */

function App() {
  const [active, setActive] = useState("work");
  const [photo, setPhoto] = useState(null);
  const [past, setPast] = useState(false);

  const [essay, setEssay] = useState(null);

  const [resetTick, setResetTick] = useState(0);

  const openPhoto = useCallback((d) => setPhoto(d), []);
  const closePhoto = useCallback(() => {
    setPhoto(null);
    setResetTick((t) => t + 1);
  }, []);

  /* An essay lives at #essay-<id>, so one piece can be linked to
     directly and the back button steps out of it. */
  const openEssay = useCallback((id) => {
    setEssay(id);
    if (window.location.hash !== "#essay-" + id) window.location.hash = "essay-" + id;
  }, []);

  const closeEssay = useCallback(() => {
    setEssay(null);
    if (window.location.hash.indexOf("#essay-") === 0) {
      history.replaceState(null, "", window.location.pathname + window.location.search);
    }
  }, []);

  useEffect(() => {
    const sync = () => {
      const m = window.location.hash.match(/^#essay-(.+)$/);
      const id = m && WRITING.some((w) => w.id === m[1]) ? m[1] : null;
      setEssay(id);
    };
    sync();
    window.addEventListener("hashchange", sync);
    return () => window.removeEventListener("hashchange", sync);
  }, []);

  /* A hover-opened photo ignores the pointer, so on a touch screen the
     next tap anywhere has to be what dismisses it. A click-opened one
     is modal instead: it holds the page still until it is closed. */
  useEffect(() => {
    if (!photo) return;
    if (photo.modal) {
      const prev = document.body.style.overflow;
      document.body.style.overflow = "hidden";
      return () => { document.body.style.overflow = prev; };
    }
    const dismiss = (e) => { if (e.pointerType !== "touch") setPhoto(null); };
    window.addEventListener("pointerdown", dismiss);
    return () => window.removeEventListener("pointerdown", dismiss);
  }, [photo]);

  /* the cover owns the first screen; the bar arrives once it is gone */
  useEffect(() => {
    const cover = document.getElementById("cover");
    if (!cover) { setPast(true); return; }
    const obs = new IntersectionObserver(
      ([e]) => setPast(!e.isIntersecting),
      { rootMargin: "-72px 0px 0px 0px" }
    );
    obs.observe(cover);
    return () => obs.disconnect();
  }, []);

  useEffect(() => {
    const ids = NAV.map((n) => n.id);
    const els = ids.map((id) => document.getElementById(id)).filter(Boolean);
    if (!els.length) return;
    const obs = new IntersectionObserver(
      (entries) => {
        const visible = entries
          .filter((e) => e.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (visible) setActive(visible.target.id);
      },
      { rootMargin: "-40% 0px -50% 0px", threshold: [0, 0.25, 0.5, 1] }
    );
    els.forEach((el) => obs.observe(el));
    return () => obs.disconnect();
  }, []);

  return (
    <div>
      <TopBar active={active} hidden={!past} />
      <main>
        <Landing />
        <Hero onPhoto={openPhoto} resetTick={resetTick} />
        <Projects />
        <Timeline />
        <Skills />
        <Photography onOpen={openPhoto} />
        <Writing onOpen={openEssay} />
        <Contact />
      </main>
      <Lightbox data={photo} onClose={closePhoto} />
      <Reader piece={WRITING.find((w) => w.id === essay) || null} onClose={closeEssay} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
