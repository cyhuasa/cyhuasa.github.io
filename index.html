<title>Form Follows Function</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">

<style>
  :root {
    --ground:      #FFFFFF;
    --ground-alt:  #EAE9E4;
    --ground-deep: #111111;
    --ink:         #111111;
    --ink-soft:    #5A5A56;
    --line:        #111111;
    --blue:        #0055B8;
    --red:         #E02424;
    --yellow:      #F5B300;
    --on-blue:     #FFFFFF;
    --on-red:      #FFFFFF;
    --on-yellow:   #111111;
    --ink-invert:  #FFFFFF;
    --border-w:    2px;
    --rule-w:      6px;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground:      #0D0D0D;
      --ground-alt:  #1A1A19;
      --ground-deep: #F3F2ED;
      --ink:         #F3F2ED;
      --ink-soft:    #9A9A93;
      --line:        #F3F2ED;
      --blue:        #2E7BE8;
      --red:         #FF4B3E;
      --yellow:      #FFC61A;
      --on-blue:     #06121F;
      --on-red:      #1A0605;
      --on-yellow:   #1A1200;
      --ink-invert:  #0D0D0D;
    }
  }

  :root[data-theme="dark"] {
    --ground:      #0D0D0D;
    --ground-alt:  #1A1A19;
    --ground-deep: #F3F2ED;
    --ink:         #F3F2ED;
    --ink-soft:    #9A9A93;
    --line:        #F3F2ED;
    --blue:        #2E7BE8;
    --red:         #FF4B3E;
    --yellow:      #FFC61A;
    --on-blue:     #06121F;
    --on-red:      #1A0605;
    --on-yellow:   #1A1200;
    --ink-invert:  #0D0D0D;
  }

  html { scroll-behavior: smooth; scroll-padding-top: 84px; }

  body {
    background: var(--ground);
    color: var(--ink);
    font-family: 'Jost', 'Noto Sans TC', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .mono { font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace; }

  .display {
    font-weight: 900;
    line-height: 0.86;
    letter-spacing: -0.035em;
    text-wrap: balance;
    text-transform: uppercase;
  }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }

  /* --- geometric entrance, from a visible resting state --- */
  @keyframes sq-in   { from { transform: translate(-14px,14px) rotate(-14deg); } to { transform: none; } }
  @keyframes ci-in   { from { transform: translateX(26px) scale(0.86); } to { transform: none; } }
  @keyframes tr-in   { from { transform: translateY(-22px) rotate(12deg); } to { transform: none; } }
  @keyframes rise    { from { transform: translateY(16px); } to { transform: none; } }
  @keyframes wipe    { from { transform: scaleX(0); } to { transform: scaleX(1); } }

  .g-sq { animation: sq-in 900ms cubic-bezier(.16,1,.3,1) both; transform-origin: 50% 50%; }
  .g-ci { animation: ci-in 900ms cubic-bezier(.16,1,.3,1) 120ms both; transform-origin: 50% 50%; }
  .g-tr { animation: tr-in 900ms cubic-bezier(.16,1,.3,1) 240ms both; transform-origin: 50% 50%; }
  .rise { animation: rise 700ms cubic-bezier(.16,1,.3,1) both; }
  .rise-1 { animation-delay: 60ms; }
  .rise-2 { animation-delay: 140ms; }
  .wipe { animation: wipe 800ms cubic-bezier(.16,1,.3,1) 200ms both; transform-origin: left center; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .g-sq, .g-ci, .g-tr, .rise, .wipe { animation: none !important; }
    * { transition-duration: 0.01ms !important; }
  }

  a:focus-visible, button:focus-visible {
    outline: 3px solid var(--blue);
    outline-offset: 3px;
  }

  ::selection { background: var(--yellow); color: #111111; }

  /* --- Bauhaus hover inversion ---------------------------------
     Elements carry --acc / --acc-on (and --base / --base-on where
     they start filled). The swap is a flat colour exchange: no
     shadow, no gradient, no easing beyond a crisp 120ms.        */

  .bh-chip {
    background: transparent;
    color: var(--ink);
    border-color: var(--line);
    transition: background-color 120ms linear, color 120ms linear, border-color 120ms linear;
  }
  .bh-chip:hover,
  .bh-chip:focus-visible {
    background: var(--acc);
    color: var(--acc-on);
    border-color: var(--acc);
  }

  .bh-btn {
    background: var(--base);
    color: var(--base-on);
    border-color: var(--line);
    transition: background-color 120ms linear, color 120ms linear, border-color 120ms linear;
  }
  .bh-btn:hover,
  .bh-btn:focus-visible {
    background: var(--acc);
    color: var(--acc-on);
    border-color: var(--acc);
  }
  .bh-btn .bh-dot { transition: background-color 120ms linear; }
  .bh-btn:hover .bh-dot { background: var(--acc-on) !important; }

  .bh-card { transition: transform 140ms ease; }
  .bh-card:hover { transform: translateY(-4px); }
  .bh-num {
    background: var(--acc);
    color: var(--acc-on);
    transition: background-color 140ms linear, color 140ms linear;
  }
  .bh-card:hover .bh-num { background: var(--ground); color: var(--acc); }
  .bh-shape { background: var(--acc-on); transition: background-color 140ms linear; }
  .bh-card:hover .bh-shape { background: var(--acc); }
  .bh-rule { transition: width 140ms ease; }
  .bh-card:hover .bh-rule { width: 100%; }

  /* --- Hero: word ⇄ figure linkage ------------------------------
     Each trait word owns one figure. Hovering a word promotes its
     figure (scale, rotation, hard offset shadow) and drops the other
     two back, so attention lands on exactly one shape at a time.  */

  .hero-word {
    display: block;
    width: max-content;
    max-width: 100%;
    line-height: 0.95;
    padding: 0.04em 0.1em;
    margin-left: -0.1em;
    border: 4px solid transparent;
    background: transparent;
    color: var(--ink);
    cursor: default;
    transition: background-color 140ms linear, color 140ms linear, border-color 140ms linear;
  }
  /* driven by state, so a figure hover lights the word and vice versa */
  .hero-word.is-on,
  .hero-word:focus-visible {
    background: var(--acc);
    color: var(--acc-on);
    border-color: var(--line);
    outline: none;
  }
  /* the two words not being pointed at step back */
  .hero-word.is-off { color: var(--ink-soft); }

  .fig-grp { cursor: pointer; }

  .fig-grp {
    transition: transform 240ms cubic-bezier(.16,1,.3,1), opacity 180ms linear;
  }
  .fig-grp .fig-shadow { opacity: 0; transition: opacity 180ms linear; }

  .fig-tri { transform-origin: 160px 282px; }
  .fig-cir { transform-origin: 244px 84px; }
  .fig-sqr { transform-origin: 82px 84px; }

  /* dim everything while one word is held … */
  svg[data-active] .fig-grp { opacity: 0.22; }

  /* … then bring the matching figure forward */
  svg[data-active="tri"] .fig-tri,
  svg[data-active="cir"] .fig-cir,
  svg[data-active="sqr"] .fig-sqr { opacity: 1; }

  svg[data-active="tri"] .fig-tri { transform: scale(1.1) rotate(-6deg); }
  svg[data-active="cir"] .fig-cir { transform: scale(1.16); }
  svg[data-active="sqr"] .fig-sqr { transform: scale(1.12) rotate(12deg); }

  svg[data-active="tri"] .fig-tri .fig-shadow,
  svg[data-active="cir"] .fig-cir .fig-shadow,
  svg[data-active="sqr"] .fig-sqr .fig-shadow { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .bh-card:hover { transform: none; }
    svg[data-active] .fig-grp { transform: none !important; }
  }

  .clamp-5 {
    display: -webkit-box;
    -webkit-line-clamp: 5;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .cjk { font-weight: 400; letter-spacing: 0.01em; line-height: 1.75; }

  /* Bauhaus half-circle / quarter-circle utility shapes */
  .half-top    { border-radius: 999px 999px 0 0; }
  .quarter-tl  { border-radius: 999px 0 0 0; }
  .quarter-br  { border-radius: 0 0 999px 0; }
</style>

function TopBar({ active }) {
  const [progress, setProgress] = useState(0);
  const [open, setOpen] = useState(false);

  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement;
      const max = h.scrollHeight - h.clientHeight;
      setProgress(max > 0 ? (h.scrollTop / max) * 100 : 0);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);

  return (
    <header
      className="sticky top-0 z-50"
      style={{ background: "var(--ground)", borderBottom: "var(--border-w) solid var(--line)" }}
    >
      <div className="mx-auto max-w-[1240px] px-5 sm:px-8">
        <div className="flex h-[62px] items-center justify-between">
          <a href="#top" className="flex items-center gap-2.5 no-underline" style={{ color: "var(--ink)" }}>
            <span aria-hidden="true" className="flex">
              <span className="block h-4 w-4" style={{ background: "var(--red)" }} />
              <span className="block h-4 w-4 rounded-full" style={{ background: "var(--blue)" }} />
              <span className="block h-4 w-4" style={{ background: "var(--yellow)", clipPath: "polygon(50% 0, 100% 100%, 0 100%)" }} />
            </span>
            <span className="mono text-[12px] font-semibold uppercase tracking-[0.18em]">{OWNER.latin}</span>
          </a>

          <nav className="hidden md:flex items-stretch h-[62px]">
            {NAV.map((item) => {
              const on = active === item.id;
              return (
                <a
                  key={item.id}
                  href={"#" + item.id}
                  className="mono flex items-center px-4 text-[11px] font-semibold uppercase tracking-[0.16em] no-underline transition-colors duration-150"
                  style={{
                    color: on ? "var(--ink-invert)" : "var(--ink)",
                    background: on ? "var(--ground-deep)" : "transparent",
                    borderLeft: "var(--border-w) solid var(--line)",
                  }}
                >
                  {item.label}
                </a>
              );
            })}
          </nav>

          <button
            className="md:hidden mono flex items-center gap-2 border-2 px-3 py-1.5 text-[11px] font-semibold uppercase tracking-[0.16em]"
            style={{ borderColor: "var(--line)", color: "var(--ink)", background: open ? "var(--yellow)" : "transparent" }}
            onClick={() => setOpen((v) => !v)}
            aria-expanded={open}
          >
            {open ? "Close" : "Menu"}
          </button>
        </div>
      </div>

      {open && (
        <nav className="md:hidden" style={{ borderTop: "var(--border-w) solid var(--line)" }}>
          {NAV.map((item) => (
            <a
              key={item.id}
              href={"#" + item.id}
              onClick={() => setOpen(false)}
              className="mono block px-5 py-3.5 text-[12px] font-semibold uppercase tracking-[0.16em] no-underline"
              style={{ color: "var(--ink)", borderBottom: "1px solid var(--line)" }}

              {item.label}
            </a>
          ))}
        </nav>
      )}

      <div aria-hidden="true" className="h-[4px]" style={{ background: "var(--ground-alt)" }}>
        <div className="h-full" style={{ width: progress + "%", background: "var(--blue)" }} />
      </div>
    </header>
  );
}

function HeroComposition({ active, onHover }) {
  /* hovering a figure reports back the same key a word would */
  const bind = (fig) => ({
    onMouseEnter: () => onHover(fig),
    onMouseLeave: () => onHover(null),
  });

  return (
    <svg
      viewBox="0 0 320 344"
      className="w-full h-auto overflow-visible"
      data-active={active || undefined}
      role="img"
      aria-label="Bauhaus composition: a yellow square for Observer, a blue circle for Synthesizer, a red triangle for Initiator"
    >
      {/* Observer — yellow square */}
      <g className="g-sq">
        <g className="fig-grp fig-sqr" {...bind("sqr")}>
          <rect className="fig-shadow" x="24" y="26" width="140" height="140" fill="var(--line)" />
          <rect x="12" y="14" width="140" height="140" fill="var(--yellow)" stroke="var(--line)" strokeWidth="4" />
        </g>
      </g>

      {/* Synthesizer — blue circle */}
      <g className="g-ci">
        <g className="fig-grp fig-cir" {...bind("cir")}>
          <circle className="fig-shadow" cx="256" cy="96" r="72" fill="var(--line)" />
          <circle cx="244" cy="84" r="72" fill="var(--blue)" stroke="var(--line)" strokeWidth="4" />
        </g>
      </g>

      {/* Initiator — red triangle */}
      <g className="g-tr">
        <g className="fig-grp fig-tri" {...bind("tri")}>
          <path className="fig-shadow" d="M 32 340 L 172 202 L 312 340 Z" fill="var(--line)" />
          <path d="M 20 328 L 160 190 L 300 328 Z" fill="var(--red)" stroke="var(--line)" strokeWidth="4" />
        </g>
      </g>
    </svg>
  );
}

/* ============================================================
   APP
   ============================================================ */

function App() {
  const [active, setActive] = useState("work");

  useEffect(() => {
    const ids = NAV.map((n) => n.id);
    const els = ids.map((id) => document.getElementById(id)).filter(Boolean);
    if (!els.length) return;
    const obs = new IntersectionObserver(
      (entries) => {
        const visible = entries
          .filter((e) => e.isIntersecting)
          .sort((a, b) => b.intersectionRatio - a.intersectionRatio)[0];
        if (visible) setActive(visible.target.id);
      },
      { rootMargin: "-40% 0px -50% 0px", threshold: [0, 0.25, 0.5, 1] }
    );
    els.forEach((el) => obs.observe(el));
    return () => obs.disconnect();
  }, []);

  return (
    <div>
      <TopBar active={active} />
      <main>
        <Hero />
        <Projects />
        <Timeline />
        <Skills />
        <Interests />
        <Contact />
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
